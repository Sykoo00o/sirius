<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="kegeldoc">
  <!-- kegeldoc mark: a rounded tile holding a sling (the pelvic floor) with a lifted dot above it,
       the "squeeze and lift" cue in one shape. Original artwork; no third-party mark is referenced. -->
  <defs>
    <linearGradient id="kd-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6f78"/>
      <stop offset="1" stop-color="#157a5a"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="12" fill="url(#kd-g)"/>
  <path d="M9.5 16.5c3 7.6 6.4 10.8 10.5 10.8s7.5-3.2 10.5-10.8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="20" cy="14" r="3.8" fill="#fff"/>
  <path d="M20 21.5v-2.2" stroke="#9fe3d2" stroke-width="2.4" stroke-linecap="round"/>
</svg>
